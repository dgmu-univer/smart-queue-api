name: CI/CD Deploy

on:
  push:
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "✅ Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.REMOTE_SERVER_HOST }}
          username: ${{ secrets.REMOTE_SERVER_USERNAME }}
          key: ${{ secrets.REMOTE_SERVER_SSH_KEY }}
          port: ${{ secrets.REMOTE_SERVER_SSH_PORT }}
          envs: POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,JWT_SECRET
          script: |
            cd ~/smart-queue-api
            cat > .env << EOF
            DOCKER_BACKEND_IMAGE=${{ secrets.DOCKER_BACKEND_IMAGE }}:latest
            SPRING_PROFILES_ACTIVE=prod
            CORS_ALLOWED_ORIGINS=*
            DB_HOST=db
            DB_PORT=5432
            REDIS_HOST=redis
            REDIS_PORT=6379
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            EOF
            echo "✅ .env file created"

      - name: Copy docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SERVER_HOST }}
          username: ${{ secrets.REMOTE_SERVER_USERNAME }}
          key: ${{ secrets.REMOTE_SERVER_SSH_KEY }}
          port: ${{ secrets.REMOTE_SERVER_SSH_PORT }}
          source: "docker-compose.yaml"
          target: "~/smart-queue-api"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_SERVER_HOST }}
          username: ${{ secrets.REMOTE_SERVER_USERNAME }}
          key: ${{ secrets.REMOTE_SERVER_SSH_KEY }}
          port: ${{ secrets.REMOTE_SERVER_SSH_PORT }}
          script: |
            set -e

            cd ~/smart-queue-api

            echo "======================================"
            echo "🚀 Starting deployment - $(date)"
            echo "======================================"

            # Login to Docker Hub
            echo "🔐 Logging in to Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest image
            echo "📦 Pulling latest image: ${{ secrets.DOCKER_BACKEND_IMAGE }}:latest"
            docker compose pull

            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker compose down

            # Start new containers
            echo "▶️  Starting new containers..."
            docker compose up -d --remove-orphans

            # Wait for health check
            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            # Check container status
            echo "📊 Container status:"
            docker compose ps

            # Show logs
            echo "📋 Application logs (last 30 lines):"
            docker compose logs --tail=30 app

            # Cleanup
            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo ""
            echo "======================================"
            echo "✅ Deployment completed - $(date)"
            echo "======================================"
