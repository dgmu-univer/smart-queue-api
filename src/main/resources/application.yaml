spring:
  session:
    timeout: 3600m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  application:
    name: smart-queue
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    generate-ddl: false
    properties:
      hibernate:
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

server:
  servlet:
    context-path: /api
    session:
      timeout: 3600m
      tracking-modes: cookie
      cookie:
        path: /

app:
  appointments:
    ttl-minutes: ${APPOINTMENTS_TTL_MINUTES:10}
    book:
      attempts-count: ${APPOINTMENTS_ATTEMPTS_COUNT:2}
      attempts-refresh-interval-in-min: ${APPOINTMENTS_ATTEMPTS_REFRESH_INTERVAL_IN_MIN:60}
  sms:
    apiKey: ${SMS_API_KEY}
    url: ${SMS_URL}
    number: ${SMS_NUMBER}
    alpha-name: ${SMS_ALPHA_NAME}