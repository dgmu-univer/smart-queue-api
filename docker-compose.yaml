services:
  app:
    image: ${DOCKER_BACKEND_IMAGE}
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APPOINTMENTS_TTL_MINUTES: ${APPOINTMENTS_TTL_MINUTES}
      APPOINTMENTS_ATTEMPTS_COUNT: ${APPOINTMENTS_ATTEMPTS_COUNT}
      APPOINTMENTS_ATTEMPTS_REFRESH_INTERVAL_IN_MIN: ${APPOINTMENTS_ATTEMPTS_REFRESH_INTERVAL_IN_MIN}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_URL: ${SMS_URL}
      SMS_NUMBER: ${SMS_NUMBER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
      - external-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:17
    container_name: smart_queue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: smart_queue_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
  external-network:
    external: true
    name: app_external-network
